<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <!-- Placeholder plate for a creation that is not live yet: a 40-week dial
       (one tick per week, longer ticks every 4 weeks, three trimester arcs)
       crossed by a heartbeat line. Abstract on purpose: no anatomy. -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#352230" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="#22131b"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <g transform="translate(600 375) rotate(-90)" fill="none">
    <!-- 40 weekly ticks: circumference 2*pi*250 = 1570.80, period 39.27 -->
    <circle r="250" stroke="#b77a93" stroke-width="18" stroke-dasharray="3 36.27"/>
    <!-- 10 major ticks every 4 weeks: period 157.08 -->
    <circle r="250" stroke="#f1c3d3" stroke-width="34" stroke-dasharray="5 152.08"/>
    <!-- Trimester arcs at r=200 (circumference 1256.64): 13, 14 and 13 weeks -->
    <circle r="200" stroke="#7d3f5a" stroke-width="12" stroke-linecap="round" stroke-dasharray="396.4 1256.64"/>
    <circle r="200" stroke="#b5648a" stroke-width="12" stroke-linecap="round" stroke-dasharray="427.8 1256.64" transform="rotate(117)"/>
    <circle r="200" stroke="#e79bba" stroke-width="12" stroke-linecap="round" stroke-dasharray="396.4 1256.64" transform="rotate(243)"/>
  </g>
  <path d="M430 375h96l20-52 30 118 26-92 16 42 14-16h138" fill="none" stroke="#fde4ee" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="600" cy="375" r="0" fill="none"/>
</svg>
